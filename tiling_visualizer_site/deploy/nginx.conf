# nginx server block for the Hailo Dynamic Tiling Showcase.
#
# Serves the self-contained static package. nginx handles HTTP Range requests
# out of the box, which is what makes frame-by-frame video seeking smooth
# (python -m http.server does NOT — playback works but seeking re-downloads).
#
# Install (Ubuntu/Debian Hailo server):
#   sudo apt-get install -y nginx
#   sudo cp -r <this-package-dir>/  /var/www/tiling-showcase
#   sudo cp <this-package-dir>/deploy/nginx.conf /etc/nginx/sites-available/tiling-showcase
#   sudo ln -sf /etc/nginx/sites-available/tiling-showcase /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Then browse to http://<server>/  (adjust server_name / listen as needed).

server {
    listen 80;
    server_name tiling-showcase.internal.hailo.ai;   # <-- change to your host

    root /var/www/tiling-showcase;
    index index.html;

    # Static site (JS/CSS/HTML) — revalidate so a re-deploy is picked up.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # Video is immutable per packaging run and large — cache it hard.
    # Range requests (enabled by default) give smooth seeking/scrubbing.
    location /data/videos/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Run JSON can be several MB — compress it.
    gzip on;
    gzip_min_length 1024;
    gzip_types application/json text/plain text/css application/javascript;
}
