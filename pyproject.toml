[project]
name = "drone-follow"
version = "0.1.0"
description = "Autonomous drone-follow using Hailo AI tiling detection"
requires-python = ">=3.10"
dependencies = [
    "mavsdk",
    "matplotlib",
    "numpy",
    "pyulog>=1.0",
    "scipy>=1.11",
]

# hailo-apps is installed by the submodule's installer (./hailo-apps/install.sh)
# into ./hailo-apps/venv_hailo_apps. It ships system bits (postprocess .so files,
# /usr/local/hailo/resources) that pip alone can't lay down, so it is NOT a
# pyproject dependency. ./install.sh runs the parent installer for you.

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
mavsdk = ["mavsdk>=2.0"]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["drone_follow*", "reid_analysis*", "hailo_tiling*"]
exclude = ["configs", "configs.*", "hailo_tiling.tests*"]

[tool.pytest.ini_options]
testpaths = ["hailo_tiling/tests", "dynamic_tiling/tests", "tests"]

[project.scripts]
drone-follow = "drone_follow.drone_follow_app:main"
hailo-tiling-warm-cache = "hailo_tiling.cli.warm:main"
hailo-tiling-import-telemetry = "hailo_tiling.cli.import_telemetry:main"
hailo-tiling-visualize = "hailo_tiling.cli.visualize:main"
hailo-tiling-bench = "hailo_tiling.cli.bench:main"
